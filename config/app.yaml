app:
  name: gap_plot_ai
  version: 0.1.0
  status: local_ready
  identity:
    dji_developer_app_name: ggp-drone-ai
    dji_developer_app_id: "189927"
    internal_service_name: gap_plot_ai
    dpk_application_identifier: ggp-drone-ai
    pilot_display_name: Gap Plot AI
    portal_apply_status: accepted
    portal_verification_status: not_verified
    unverified_device_limit: 20

camera:
  position: DJI_LIVEVIEW_CAMERA_POSITION_NO_1
  source: DJI_LIVEVIEW_CAMERA_SOURCE_M4E_VIS
  pixel_format: PIXFMT_RGB_PACKED

runtime:
  root: runtime
  queue_capacity: 2
  worker_poll_ms: 10
  device: auto
  reuse_last_segmentation: true

models:
  detector:
    enabled: true
    path: models/source/plant_center_manual_v1_b0_best.pt
    source_sha256: 5076ac21814b4ad1955dbdc3cc7aa25dca62659914467e0e651fbb7f8d821266
    onnx_path: models/onnx/plant_center_manual_v1_b0_best.onnx
    engine_path: models/engine/plant_center_manual_v1_b0_tensorrt-8.5.2_cuda-11.4_aarch64_fp16.engine
    task: detect
    image_size: 1024
    confidence_threshold: 0.2
    nms_iou_threshold: 0.1
    max_detections: 1000
    tiled: true
    tile_size: 1024
    tile_overlap: 128
    global_nms_iou: 0.1
    center_duplicate_radius_px: 8.0
    enable_center_suppression: true
    max_detections_full_frame: 5000
    pilot_overlay_max_boxes: 200
    interval_frames: 1
    class_names:
      0: plant
    normalization:
      implementation: ultralytics
      input_color: BGR_numpy_to_model_RGB
      scale: 0_255_to_0_1
      mean: null
      std: null
    onnx_export:
      opset: 17
      batch: 1
      dynamic: false
      simplify: false
      fp16: false
      int8: false
      embedded_nms: false
    tensorrt:
      target_version: 8.5.2
      cuda_version: 11.4
      architecture: aarch64
      precision: FP16
      dynamic: false
      workspace_gib: 2
  segmenter:
    enabled: true
    path: models/source/plot_segmenter_b4_selected_best.pt
    source_sha256: 1fd2a8d78fda17f3f2938035aced92f0c2aa346cdf26df3d71b87a15982f3519
    onnx_path: models/onnx/plot_segmenter_b4_selected_best.onnx
    engine_path: models/engine/plot_segmenter_b4_selected_tensorrt-8.5.2_cuda-11.4_aarch64_fp16.engine
    task: segment
    image_size: 1280
    confidence_threshold: 0.03
    nms_iou_threshold: 0.7
    max_detections: 100
    interval_frames: 5
    retina_masks: true
    morphology_open_kernel: 3
    morphology_close_kernel: 3
    contour_min_area_px: 256
    contour_epsilon_ratio: 0.002
    contour_max_points: 96
    class_names:
      0: plantable_area
    normalization:
      implementation: ultralytics
      input_color: BGR_numpy_to_model_RGB
      scale: 0_255_to_0_1
      mean: null
      std: null
    onnx_export:
      opset: 17
      batch: 1
      dynamic: false
      simplify: false
      fp16: false
      int8: false
      embedded_nms: false
    tensorrt:
      target_version: 8.5.2
      cuda_version: 11.4
      architecture: aarch64
      precision: FP16
      dynamic: false
      workspace_gib: 2

overlay:
  detector_bgr: [0, 255, 0]
  segmenter_bgr: [0, 215, 255]
  status_bgr: [255, 255, 255]
  line_width: 2
  show_labels: true
  show_status: true

storage:
  max_session_bytes: 1073741824
  min_free_bytes: 1610612736
  jsonl_rotate_bytes: 83886080
  jsonl_backup_count: 2
  log_rotate_bytes: 10485760
  log_backup_count: 5
  save_snapshots: true
  save_preview_video: false

parity:
  detector_count_tolerance: 2
  detector_confidence_abs_tolerance: 0.03
  detector_bbox_abs_tolerance_px: 4.0
  segmenter_union_iou_min: 0.98
