extends: app.yaml

app:
  status: dev_live_ready
  identity:
    pilot_display_name: Gap Plot AI DEV

live:
  camera: M4E_VIS
  input_mode: decoded_rgb
  decoded_pixel_format: RGB_PACKED
  h264_fallback:
    enabled: false
    decoder: official_sample_ffmpeg4
    frame_queue_size: 1
    drop_old_frames: true
  target_inference_fps: 1.5
  frame_queue_size: 1
  drop_old_frames: true
  batch_size: 1
  warmup_before_running: true
  stream_timeout_ms: 5000
  reconnect_interval_ms: 5000
  worker_heartbeat_timeout_ms: 3000

runtime:
  queue_capacity: 1

models:
  detector:
    enabled: true
    engine_path: /home/dji/gap_plot_ai_assets/models/engine/plant_center_manual_v1_b0_best_fp16.engine
    engine_dir: null
    enable_center_suppression: false
    global_nms_backend: opencv
  segmenter:
    enabled: true
    engine_path: /home/dji/gap_plot_ai_assets/models/engine/plot_segmenter_b4_selected_best_fp16.engine
    engine_dir: null

overlay:
  enabled: true
  max_objects: auto
  min_confidence: existing
  mode: compact
  selection_strategy: confidence
  stale_result_timeout_ms: 1500
  debug_static_boxes: false

logging:
  enabled: true
  save_all_detections: true
  save_sample_frames: false
  sample_interval_seconds: 5
